<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İzin & Rapor Yönetimi - Umut Salman Asistan</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #10b981; --text: #f8fafc; --border: rgba(255, 255, 255, 0.08); --danger: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        h2 { color: var(--accent); margin-bottom: 20px; text-align: center; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: var(--card); color: white; border: 1px solid var(--border); padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; }
        .tab-btn.active { background: var(--accent); border-color: var(--accent); }
        .panel { background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 20px; }
        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        input, select { background: var(--bg); border: 1px solid var(--border); padding: 10px; border-radius: 8px; color: white; outline: none; width: 100%; }
        label { font-size: 11px; color: #94a3b8; display: block; margin-bottom: 5px; font-weight: 800; }
        .btn-group { margin-top: 15px; display: flex; gap: 10px; }
        .btn { padding: 10px 20px; border-radius: 8px; cursor: pointer; border: none; font-weight: 700; transition: 0.3s; }
        .btn-add { background: var(--accent); color: white; }
        .btn-excel { background: #1d6f42; color: white; }
        .page { display: none; }
        .page.active { display: block; }
        
        .cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .nav-btn { background: var(--accent); color: white; border: none; padding: 5px 15px; border-radius: 8px; cursor: pointer; font-weight: 800; }

        .calendar-header { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 5px; text-align: center; font-weight: 800; font-size: 12px; color: var(--accent); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 5px; }
        .cal-day { background: var(--bg); border: 1px solid var(--border); min-height: 95px; padding: 8px; border-radius: 8px; position: relative; }
        .cal-date { font-weight: 800; font-size: 12px; margin-bottom: 5px; opacity: 0.9; display: flex; justify-content: space-between; }
        .cal-content { font-size: 10px; }
        .need-staff { background: var(--danger); color: white; padding: 2px 4px; border-radius: 4px; display: block; margin-top: 3px; font-weight: 800; text-align: center; font-size: 9px; line-height: 1.2; }
        .g1-work-day { background: rgba(59, 130, 246, 0.1) !important; border-top: 3px solid #3b82f6; }
        .g2-work-day { background: rgba(139, 92, 246, 0.1) !important; border-top: 3px solid #8b5cf6; }
        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 10px; overflow: hidden; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
        th { background: rgba(16, 185, 129, 0.1); color: var(--accent); text-transform: uppercase; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; }
        .g1 { background: #3b82f6; } .g2 { background: #8b5cf6; }
        .day-picker { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; max-height: 150px; overflow-y: auto; padding: 5px; background: rgba(0,0,0,0.2); border-radius: 8px; }
        .day-opt { font-size: 10px; padding: 6px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 5px; cursor: pointer; display: flex; flex-direction: column; align-items: center; min-width: 60px; }
        .day-opt.selected { background: var(--accent); border-color: var(--accent); color: white; }
        .day-opt.g1-style { border-bottom: 3px solid #3b82f6; }
        .day-opt.g2-style { border-bottom: 3px solid #8b5cf6; }
    </style>
</head>
<body>

<div class="container">
    <h2>📅 M4 Operasyonel Takip Paneli</h2>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('kayit')">Kayıt Girişi</button>
        <button class="tab-btn" onclick="switchTab('vardiya')">Takvim & Takviye</button>
    </div>

    <div id="kayitPage" class="page active">
        <div class="panel">
            <div class="grid-form">
                <input type="hidden" id="editIndex" value="-1">
                <div><label>Tür</label><select id="tur"><option value="İzinli">İzinli</option><option value="Raporlu">Raporlu</option></select></div>
                <div><label>Sicil</label><input type="text" id="sicil" list="sicilList" oninput="otomatikDoldur('sicil')"></div>
                <div><label>İsim Soyisim</label><input type="text" id="isim" list="isimList" oninput="otomatikDoldur('isim')"></div>
                <div><label>Grup</label><select id="grup" onchange="generateSpecificDays()"><option value="1. Grup">1. Grup</option><option value="2. Grup">2. Grup</option></select></div>
                <div><label>Dilim</label><select id="dilim"><option value="Gündüz">Gündüz</option><option value="Gece">Gece</option></select></div>
                <div><label>Başlangıç</label><input type="date" id="baslangic" onchange="generateSpecificDays()"></div>
                <div><label>Bitiş</label><input type="date" id="bitis" onchange="generateSpecificDays()"></div>
                <div><label>Açıklama / Onay Veren</label>
                    <select id="onayVeren">
                        <option value="">Seçiniz...</option>
                        <option value="RAVZA ANIL ÇOBANDAĞ">RAVZA ANIL ÇOBANDAĞ</option>
                        <option value="OSMAN ÖZKAN ÖZTÜRK">OSMAN ÖZKAN ÖZTÜRK</option>
                        <option value="SEMİH TÜRKÜSEV">SEMİH TÜRKÜSEV</option>
                        <option value="DERYA TAŞKIN">DERYA TAŞKIN</option>
                        <option value="ÜMÜT SALMAN">ÜMÜT SALMAN</option>
                        <option value="NAZİRE BÜLBÜL">NAZİRE BÜLBÜL</option>
                    </select>
                </div>
                <div>
                    <label>Takviye Talebi</label>
                    <select id="takviye" onchange="toggleDayPicker()"><option value="Yok">Gerekmiyor</option><option value="Hepsi">Her Gün Lazım</option><option value="Secili">Sadece Belirli Günler</option></select>
                </div>
                <div id="dayPickerCont" style="display:none; grid-column: 1 / -1;">
                    <label>Takviye İstediğin Tarihleri Seç</label>
                    <div id="specificDaysList" class="day-picker"></div>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn btn-add" id="mainBtn" onclick="kaydet()">VERİYİ İŞLE</button>
                <button class="btn" style="background:#64748b; color:white;" onclick="formuTemizle()">TEMİZLE</button>
            </div>
        </div>

        <datalist id="isimList"></datalist>
        <datalist id="sicilList"></datalist>

        <div class="panel" style="display:flex; gap:10px; align-items:flex-end;">
            <div style="flex:1;"><label>Arama</label><input type="text" id="aramaInput" onkeyup="ara()" placeholder="İsim veya grup ara..."></div>
            <button class="btn btn-excel" onclick="excelAktar()">📊 EXCEL</button>
        </div>

        <table>
            <thead><tr><th>Tür/Grup</th><th>Personel</th><th>Tarihler</th><th>Takviye</th><th>Eylem</th></tr></thead>
            <tbody id="izinListesi"></tbody>
        </table>
    </div>

    <div id="vardiyaPage" class="page">
        <div class="panel">
            <div class="cal-nav">
                <button class="nav-btn" onclick="degistirAy(-1)">◀ Geri</button>
                <h3 id="currentMonthTitle" style="color:var(--accent);">Aylık Durum</h3>
                <button class="nav-btn" onclick="degistirAy(1)">İleri ▶</button>
            </div>
            <div class="calendar-header"><div>PZT</div><div>SAL</div><div>ÇAR</div><div>PER</div><div>CUM</div><div>CMT</div><div>PAZ</div></div>
            <div class="calendar-grid" id="calendarContainer"></div>
        </div>
        <div id="vardiyaOzet" style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;"></div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJm1YcPw0HqJ6HZumC3spv7dZJC4pN8FQcisykGz6VLKtSqQrWh4cG39xIkIdI4pIq/exec";

    const PERSONEL_HAFIZA = [{sicil:"1004151", isim:"KÜBRA RAHAT"}, {sicil:"1004739", isim:"SERENAY RABİA YUMUŞAK"}, {sicil:"1005876", isim:"SERDAR SUİÇMEZ"}, 
        {sicil:"1004415", isim:"RECEP CEMAL ASLAN"}, {sicil:"1004696", isim:"ÖMER ŞAHİN"}, {sicil:"1005717", isim:"DOĞA ÇOKER"}, 
        {sicil:"1002411", isim:"ALİ BAYRAKTAR"}, {sicil:"1004603", isim:"NURİ MUSTAFA UYAR"}, {sicil:"1004745", isim:"MURAT ÇINAROĞLU"},  
        {sicil:"1004175", isim:"HARUN ENGİN"}, {sicil:"1004098", isim:"EMRE SEYREK"}, {sicil:"1006223", isim:"SEMİH EJDER"}];

    let izinler = [];
    let seciliTarih = new Date(); 
    const BAZ_YIL = 2026, BAZ_AY = 4, BAZ_GUN = 6; 

    window.onload = async function() {
        initDataLists();
        await verileriBuluttanCek();
    };

    // Tarih Kaymasını Engelleyen Fonksiyon
    function formatTarihMetni(rawDate) {
        if(!rawDate) return "";
        let d = new Date(rawDate);
        if (isNaN(d.getTime())) return rawDate; // Zaten string ise bozma
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    }

    async function verileriBuluttanCek() {
        try {
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();
            izinler = data.map(row => ({
                sicil: row[0],
                isim: row[1],
                grup: row[2],
                dilim: row[3],
                baslangic: formatTarihMetni(row[4]), // Excel'den gelen veriyi metne zorla
                bitis: formatTarihMetni(row[5]),
                onayVeren: row[6],
                takviye: row[7],
                tur: row[8],
                seciliTarihler: JSON.parse(row[9] || "[]")
            }));
            tabloyuGuncelle();
        } catch (e) { console.error("Veri çekilemedi:", e); }
    }

    function degistirAy(yon) {
        seciliTarih.setMonth(seciliTarih.getMonth() + yon);
        renderCalendar();
    }

    function otomatikDoldur(tip) {
        const isimInput = document.getElementById('isim');
        const sicilInput = document.getElementById('sicil');
        let bul;
        if(tip === 'sicil') bul = PERSONEL_HAFIZA.find(p => p.sicil === sicilInput.value);
        else bul = PERSONEL_HAFIZA.find(p => p.isim.toUpperCase() === isimInput.value.toUpperCase());
        if(bul) { isimInput.value = bul.isim; sicilInput.value = bul.sicil; generateSpecificDays(); }
    }

    function initDataLists() {
        const iList = document.getElementById('isimList'); const sList = document.getElementById('sicilList');
        iList.innerHTML = ''; sList.innerHTML = '';
        PERSONEL_HAFIZA.forEach(p => { iList.innerHTML += `<option value="${p.isim}">`; sList.innerHTML += `<option value="${p.sicil}">`; });
    }

    function getVardiyaDurumu(tarihStr) {
        const parts = tarihStr.split('-');
        const hedef = new Date(parts[0], parts[1]-1, parts[2]);
        const baz = new Date(BAZ_YIL, BAZ_AY, BAZ_GUN);
        hedef.setHours(0,0,0,0); baz.setHours(0,0,0,0);
        const farkMs = hedef.getTime() - baz.getTime();
        const farkGun = Math.round(farkMs / (1000 * 60 * 60 * 24));
        let mod = farkGun % 4;
        if (mod < 0) mod += 4;
        return (mod === 0 || mod === 1) ? "1. Grup" : "2. Grup";
    }

    function generateSpecificDays() {
        const bas = document.getElementById('baslangic').value;
        const bit = document.getElementById('bitis').value;
        const seciliGrup = document.getElementById('grup').value;
        const container = document.getElementById('specificDaysList');
        if (!bas || !bit) return;
        container.innerHTML = '';
        
        let dBas = new Date(bas + 'T00:00:00'); 
        let dBit = new Date(bit + 'T00:00:00');
        
        const gunler = ["Paz", "Pzt", "Sal", "Çar", "Per", "Cum", "Cmt"];
        for (let d = new Date(dBas); d <= dBit; d.setDate(d.getDate() + 1)) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const dateStr = `${y}-${m}-${day}`;
            
            const calisanGrup = getVardiyaDurumu(dateStr);
            const opt = document.createElement('div');
            const isGrupMatch = (calisanGrup === seciliGrup);
            opt.className = `day-opt ${isGrupMatch ? (seciliGrup === '1. Grup' ? 'g1-style' : 'g2-style') : ''}`;
            opt.innerHTML = `<strong>${day}.${m}</strong><span>${gunler[d.getDay()]}</span>`;
            opt.dataset.date = dateStr;
            opt.onclick = function() { this.classList.toggle('selected'); };
            container.appendChild(opt);
        }
    }

    function toggleDayPicker() {
        const val = document.getElementById('takviye').value;
        document.getElementById('dayPickerCont').style.display = (val === 'Secili') ? 'block' : 'none';
        if(val === 'Secili') generateSpecificDays();
    }

    function renderCalendar() {
        const container = document.getElementById('calendarContainer');
        container.innerHTML = '';
        const year = seciliTarih.getFullYear();
        const month = seciliTarih.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const startOffset = firstDay === 0 ? 6 : firstDay - 1;
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        document.getElementById('currentMonthTitle').innerText = new Intl.DateTimeFormat('tr-TR', { month: 'long', year: 'numeric' }).format(seciliTarih);
        for (let x = 0; x < startOffset; x++) container.innerHTML += `<div class="cal-day" style="opacity:0.2"></div>`;
        for (let day = 1; day <= daysInMonth; day++) {
            const dStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            const calisanGrup = getVardiyaDurumu(dStr);
            const gunlukKayitlar = izinler.filter(i => dStr >= i.baslangic && dStr <= i.bitis && i.grup === calisanGrup);
            let gunduzCount = 0, geceCount = 0;
            gunlukKayitlar.forEach(i => {
                let lazim = (i.takviye === 'Hepsi') || (i.takviye === 'Secili' && i.seciliTarihler && i.seciliTarihler.includes(dStr));
                if (lazim) { if (i.dilim === 'Gündüz') gunduzCount++; else geceCount++; }
            });
            const dayDiv = document.createElement('div');
            dayDiv.className = `cal-day ${calisanGrup === '1. Grup' ? 'g1-work-day' : 'g2-work-day'}`;
            let tHtml = gunduzCount > 0 ? `<span class="need-staff" style="background:#fbbf24; color:#000;">☀️ Gündüz: ${gunduzCount}</span>` : '';
            tHtml += geceCount > 0 ? `<span class="need-staff" style="background:#475569;">🌙 Gece: ${geceCount}</span>` : '';
            dayDiv.innerHTML = `<div class="cal-date"><span>${day}</span><span style="font-size:8px; color:var(--accent)">${calisanGrup.split(' ')[0]}</span></div>
                <div class="cal-content">${gunlukKayitlar.length > 0 ? `<div style="font-size:10px;">🏖️${gunlukKayitlar.filter(x=>x.tur==='İzinli').length} 🏥${gunlukKayitlar.filter(x=>x.tur==='Raporlu').length}</div>` : ''}${tHtml}</div>`;
            container.appendChild(dayDiv);
        }
        vardiyaRaporuOlustur();
    }

    async function kaydet() {
        const data = {
            sicil: document.getElementById('sicil').value,
            isim: document.getElementById('isim').value,
            grup: document.getElementById('grup').value,
            dilim: document.getElementById('dilim').value,
            baslangic: document.getElementById('baslangic').value,
            bitis: document.getElementById('bitis').value,
            onayVeren: document.getElementById('onayVeren').value,
            takviye: document.getElementById('takviye').value,
            tur: document.getElementById('tur').value,
            seciliTarihler: Array.from(document.querySelectorAll('.day-opt.selected')).map(el => el.dataset.date)
        };
        if(!data.isim || !data.baslangic) return alert("Eksik bilgi!");
        const btn = document.getElementById('mainBtn');
        btn.innerText = "İŞLENİYOR..."; btn.disabled = true;
        try {
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
            const idx = document.getElementById('editIndex').value;
            if(idx !== "-1") izinler[idx] = data; else izinler.push(data);
            formuTemizle(); tabloyuGuncelle(); alert("Kaydedildi.");
        } catch (e) { alert("Hata!"); } finally { btn.innerText = "VERİYİ İŞLE"; btn.disabled = false; }
    }

    function tabloyuGuncelle(data = izinler) {
        const liste = document.getElementById('izinListesi'); liste.innerHTML = '';
        data.forEach((item, index) => {
            // Tabloda gösterirken DD.MM.YYYY formatına çevir
            let bArr = item.baslangic.split('-');
            let fBas = bArr.length === 3 ? `${bArr[2]}.${bArr[1]}.${bArr[0]}` : item.baslangic;
            let bitArr = item.bitis.split('-');
            let fBit = bitArr.length === 3 ? `${bitArr[2]}.${bitArr[1]}.${bitArr[0]}` : item.bitis;

            liste.innerHTML += `<tr>
                <td><span class="badge" style="border:1px solid ${item.tur === 'Raporlu' ? '#ef4444':'transparent'}">${item.tur}</span><br><span class="badge ${item.grup === '1. Grup' ? 'g1':'g2'}">${item.grup}</span></td>
                <td><strong>${item.isim}</strong><br><small>${item.dilim}</small></td>
                <td>${fBas} / ${fBit}</td>
                <td>${item.takviye !== 'Yok' ? '⚠️ Takviye' : 'Yok'}</td>
                <td>
                    <button onclick="duzenle(${index})" style="color:#f59e0b; background:none; border:none; cursor:pointer; font-weight:800;">DÜZENLE</button>
                    <button onclick="sil(${index})" style="color:#ef4444; background:none; border:none; cursor:pointer; font-weight:800; margin-left:10px;">SİL</button>
                </td>
            </tr>`;
        });
    }

    function duzenle(index) {
        const item = izinler[index];
        document.getElementById('editIndex').value = index;
        document.getElementById('sicil').value = item.sicil;
        document.getElementById('isim').value = item.isim;
        document.getElementById('grup').value = item.grup;
        document.getElementById('dilim').value = item.dilim;
        document.getElementById('baslangic').value = item.baslangic;
        document.getElementById('bitis').value = item.bitis;
        document.getElementById('onayVeren').value = item.onayVeren;
        document.getElementById('takviye').value = item.takviye;
        document.getElementById('tur').value = item.tur;
        toggleDayPicker();
        document.getElementById('mainBtn').innerText = "GÜNCELLE";
        switchTab('kayit');
    }

    function formuTemizle() {
        document.getElementById('editIndex').value = "-1";
        ['sicil', 'isim', 'onayVeren', 'baslangic', 'bitis'].forEach(f => document.getElementById(f).value = '');
        document.getElementById('takviye').value = 'Yok';
        document.getElementById('mainBtn').innerText = "VERİYİ İŞLE";
        toggleDayPicker();
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn, .page').forEach(el => el.classList.remove('active'));
        const btn = Array.from(document.querySelectorAll('.tab-btn')).find(b => b.textContent.includes(tab==='kayit'?'Kayıt':'Takvim'));
        if(btn) btn.classList.add('active');
        document.getElementById(tab + 'Page').classList.add('active');
        if(tab === 'vardiya') renderCalendar();
    }

    function vardiyaRaporuOlustur() {
        const ozet = document.getElementById('vardiyaOzet'); ozet.innerHTML = '';
        const y = seciliTarih.getFullYear(); const m = String(seciliTarih.getMonth() + 1).padStart(2, '0');
        const ayFiltresi = `${y}-${m}`;
        ["1. Grup", "2. Grup"].forEach(g => {
            const list = izinler.filter(i => i.grup === g && (i.baslangic.includes(ayFiltresi) || i.bitis.includes(ayFiltresi)));
            let h = `<div class="panel"><h4>${g} - ${new Intl.DateTimeFormat('tr-TR', { month: 'long' }).format(seciliTarih)}</h4><ul style="list-style:none; font-size:12px; margin-top:10px;">`;
            if(list.length === 0) h += `<li style="opacity:0.5">Kayıt yok.</li>`;
            list.forEach(p => h += `<li style="margin-bottom:5px; border-bottom:1px solid var(--border); padding-bottom:3px;">${p.tur === 'Raporlu' ? '🏥' : '🏖️'} ${p.isim} <span style="float:right; opacity:0.6">${p.dilim}</span></li>`);
            ozet.innerHTML += h + '</ul></div>';
        });
    }

    function ara() {
        const k = document.getElementById('aramaInput').value.toLowerCase();
        tabloyuGuncelle(izinler.filter(i => Object.values(i).some(v => v.toString().toLowerCase().includes(k))));
    }

    function excelAktar() {
        const ws = XLSX.utils.json_to_sheet(izinler); const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Kayitlar"); XLSX.writeFile(wb, "M4_Rapor.xlsx");
    }

    function sil(index) { if(confirm("Siliniyor?")) { izinler.splice(index, 1); tabloyuGuncelle(); } }
</script>
</body>
</html>
